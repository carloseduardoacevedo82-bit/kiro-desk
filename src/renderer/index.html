<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:">
  <title>Kiro Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="collapsed">
  <div id="island" class="island">
    <!-- Barra (siempre visible) -->
    <div class="bar" id="bar">
      <button class="avatar-btn" id="avatarBtn" title="Abrir Kiro (Ctrl+Alt+Espacio)"><div class="kiro small" id="kiroSmall"></div></button>
      <div class="bar-text" id="barText">
        <span class="bar-main" id="barMain">Hola</span>
        <span class="bar-sub" id="barSub"></span>
      </div>
      <span class="badge" id="badge"></span>
      <button class="mic" id="micBar" title="Hablarle (Ctrl+Alt+K)"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
    </div>

    <!-- Aviso (recordatorios, actualizaciones) -->
    <div class="notice" id="notice">
      <div class="notice-title" id="noticeTitle"></div>
      <div class="notice-text" id="noticeText"></div>
      <div class="notice-actions" id="noticeActions"></div>
    </div>

    <!-- Panel -->
    <div class="panel" id="panel">
      <div class="hero">
        <div class="kiro big" id="kiroBig"></div>
        <div class="bubble" id="bubble">¡Hola! Soy Kiro. Dime "Kiro" o escríbeme abajo.</div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="home" class="on">Inicio</button>
        <button data-tab="tasks">Tareas</button>
        <button data-tab="habits">Hábitos</button>
        <button data-tab="focus">Enfoque</button>
        <button data-tab="pc">Mi PC</button>
        <button data-tab="settings" title="Ajustes" class="icon"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg></button>
      </nav>
      <section class="view" id="view"></section>
      <form class="ask" id="askForm" autocomplete="off">
        <input id="askInput" placeholder="Escríbele a Kiro…" maxlength="500">
        <button type="button" class="mic" id="micPanel" title="Hablar"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
        <button type="submit" class="send" title="Enviar"><svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9z"/></svg></button>
      </form>
    </div>
  </div>
  <script src="kiro.js"></script>
  <script src="app.js"></script>
</body>
</html>
