<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:">
  <title>Kiro Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="collapsed">
  <div id="island" class="island">
    <!-- Barra (isla cerrada) -->
    <div class="bar" id="bar">
      <button class="avatar-btn" id="avatarBtn" title="Abrir Kiro (Ctrl+Alt+Espacio)"><div class="kiro small" id="kiroSmall"></div></button>
      <div class="bar-text" id="barText">
        <span class="bar-main" id="barMain">Hola</span>
        <span class="bar-sub" id="barSub"></span>
      </div>
      <span class="badge" id="badge"></span>
      <button class="mic" id="micBar" title="Hablarle (Ctrl+Alt+K)"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></button>
    </div>

    <!-- Aviso -->
    <div class="notice" id="notice">
      <div class="notice-title" id="noticeTitle"></div>
      <div class="notice-text" id="noticeText"></div>
      <div class="notice-actions" id="noticeActions"></div>
    </div>

    <!-- Panel abierto -->
    <div class="panel" id="panel">
      <aside class="side">
        <div class="me">
          <button class="me-avatar" id="meAvatar" title="Hablarle (Ctrl+Alt+K)"><div class="kiro big" id="kiroBig"></div></button>
          <div class="me-text">
            <b>Kiro</b>
            <span class="status" id="status"><i></i><em id="statusText">Listo</em></span>
          </div>
        </div>
        <nav class="nav" id="tabs">
          <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5z"/></svg><span>Inicio</span></button>
          <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M4 6.5h2v-2H4zm4-.75h12v-1.5H8zM4 12.75h2v-2H4zm4-.75h12v-1.5H8zM4 19h2v-2H4zm4-.75h12v-1.5H8z"/></svg><span>Tareas</span><small class="count" id="cTasks"></small></button>
          <button data-tab="habits"><svg viewBox="0 0 24 24"><path d="M12 2.7c-3.4 4.3-6.5 8-6.5 11.6a6.5 6.5 0 0 0 13 0c0-3.6-3.1-7.3-6.5-11.6z"/></svg><span>Hábitos</span><small class="count" id="cHabits"></small></button>
          <button data-tab="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg><span>Enfoque</span><small class="count" id="cFocus"></small></button>
          <button data-tab="pc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h18"/></svg><span>Mi PC</span></button>
          <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg><span>Ajustes</span></button>
        </nav>
      </aside>
      <main class="main" id="view"></main>
    </div>
  </div>
  <script src="kiro.js"></script>
  <script src="app.js"></script>
</body>
</html>
